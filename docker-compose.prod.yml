services:
  pohr:
    image: roclh/pohr:latest
    container_name: pohr
    ports:
      # Панель — только на loopback: снаружи её нет ни по 443 (Caddy), ни по 8080.
      # Доступ: ssh -L 8080:127.0.0.1:8080 root@<host>, затем http://127.0.0.1:8080
      - "127.0.0.1:${POHR_PORT:-8080}:8080"
      - "${POHR_VPN_PORT:-8443}:8443"
      - "${POHR_TELEMT_PORT:-3128}:3128"
    volumes:
      - pohr-data:/app/data
      - pohr-xray:/app/xray
      - pohr-scripts:/app/scripts
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - POHR_PUBLIC_URL=${POHR_PUBLIC_URL}
      - POHR_EDGE_SERVER_IP=${POHR_EDGE_SERVER_IP:-}
      - POHR_SSH_AUTHORIZED_KEYS=${POHR_SSH_AUTHORIZED_KEYS:-}
      - XRAY_AUTO_INSTALL=${XRAY_AUTO_INSTALL:-true}
      - EU_XRAY_VERSION=${EU_XRAY_VERSION:-latest}
    restart: unless-stopped

volumes:
  pohr-data:
  pohr-xray:
  pohr-scripts: