services:
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: pohr-xray
    restart: unless-stopped
    volumes:
      - ./xray:/etc/xray
    command: ["run", "-c", "/etc/xray/config.json"]
    ports:
      - "${POHR_PORT:-8080}:8080"
      - "${POHR_VPN_PORT:-8443}:8443"
      - "${POHR_TELEMT_PORT:-3128}:3128"