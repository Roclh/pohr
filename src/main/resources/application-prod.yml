xray:
  home: /app/xray
  install:
    auto: ${XRAY_AUTO_INSTALL:true}
    version: ${XRAY_VERSION:latest}
    download-url-template: https://github.com/XTLS/Xray-core/releases/download/v{version}/Xray-{platform}.zip
    fallback-url-template: ${XRAY_FALLBACK_URL:}
  server:
    host: ${XRAY_HOST:}
    public-port: ${XRAY_PUBLIC_PORT:443}
  reality:
    dest: ${XRAY_REALITY_DEST:www.microsoft.com:443}
    server-names: ${XRAY_REALITY_SNI:www.microsoft.com}
  start:
    auto: ${XRAY_AUTO_START:true}

pohr:
  metrics:
    interval-ms: ${METRICS_INTERVAL_MS:60000}
    initial-delay-ms: 15000
    retention-days: ${METRICS_RETENTION_DAYS:7}
  scripts:
    home: ${SCRIPTS_HOME:/app/scripts}
  telegram:
    socks-port: 10809
    metrics-port: 9400
    install:
      version: ${TELEMT_VERSION:latest}
      download-url-template: https://github.com/telemt/telemt/releases/download/v{version}/telemt-{platform}.tar.gz
      fallback-url-template: ${TELEMT_FALLBACK_URL:}
      latest-api: ${TELEMT_LATEST_API:https://api.github.com/repos/telemt/telemt/releases/latest}