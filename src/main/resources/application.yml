spring:
  application:
    name: pohr
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: jdbc:sqlite:./data/pohr.db?journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

pohr:
  node:
    id: ${POHR_NODE_ID:local}
  xray:
    api-port: ${XRAY_API_PORT:10085}
    # Ограничение Go-кучи Xray: без него warmed-up процесс занимает ~195 МБ RSS.
    gomemlimit: ${XRAY_GOMEMLIMIT:160MiB}
    gogc: ${XRAY_GOGC:50}
  processes:
    reaper:
      # Периодически убивает xray/telemt, которые остались не под управлением
      # менеджеров (неудачный старт, ручной запуск внутри контейнера, зависший
      # `xray api`). Процессы хоста вне контейнера не видны — другой PID-namespace.
      enabled: ${PROCESS_REAPER_ENABLED:true}
      interval-ms: 300000
      initial-delay-ms: 120000
      min-age-seconds: 300
  traffic:
    enabled: ${TRAFFIC_ENABLED:true}
    interval-ms: ${TRAFFIC_INTERVAL_MS:60000}
    initial-delay-ms: 25000
    inbound-port: ${POHR_VPN_PORT:8443}
    retention-days: 7
    daily-retention-days: 400
  public-url: ${POHR_PUBLIC_URL:}
  # Публичный адрес панели (логин, инвайты, выдача ссылок). Живёт на отдельном
  # хосте, чтобы apex отдавал сайт; на апексе остаются только /sub/* и /invite/*.
  # Пусто — панель наружу не публикуется (только loopback).
  panel-url: ${POHR_PANEL_URL:https://panel.pohr-roclh.xyz}
  scripts:
    home: ${SCRIPTS_HOME:./scripts}
  eu-nodes:
    enroll-token-ttl: 1h
    cleanup-interval: 600000
    tunnel-socks-port: 10808
    xray-version: ${EU_XRAY_VERSION:latest}
    default-port: 8443
    # Профиль EU-inbound по умолчанию (Т06): своё имя + локальный Caddy-сайт.
    # Профиль конкретного узла (Т03) всегда перекрывает эти значения.
    reality:
      sni: ${EU_REALITY_SNI:eu.pohr-roclh.xyz}
      target: ${EU_REALITY_TARGET:127.0.0.1:443}
    tunnel-check-interval: 60000       # ms = 1 минут
    tunnel-check-initial-delay: 30000   # 30 сек — дать Xray время подняться
    tunnel-check-timeout-seconds: 15
    tunnel-check-failures-threshold: 3
    tunnel-check-url: https://api.ipify.org
  invites:
    cleanup-interval: 600000
  edge:
    home: ${EDGE_HOME:/app/xray}      # тот же volume, что xray
    auto-start: ${EDGE_AUTO_START:true}
    # Синхронизировать файлы сайта-легенды из образа в volume. false — только
    # создавать отсутствующие файлы (ручные правки в volume сохраняются).
    site-sync: ${EDGE_SITE_SYNC:true}
    # Явный IP сервера для сверки A-записей SNI. Пусто — берётся из pohr.public-url.
    server-ip: ${POHR_EDGE_SERVER_IP:}
    # Доп. адреса (IP/CIDR через запятую), которым разрешён доступ к панельному
    # Caddy-сайту. Пусто — доступен всем, у кого есть URL панели (защита — логин
    # и инвайты). Если задано — чужие IP получают 404 (ужесточение).
    panel-allowlist: ${POHR_EDGE_PANEL_ALLOWLIST:}
  metrics:
    interval-ms: 60000
    initial-delay-ms: 15000
    retention-days: 7
  telegram:
    socks-port: 10809
    metrics-port: 9400
    install:
      version: ${TELEMT_VERSION:latest}
      download-url-template: ${TELEMT_DOWNLOAD_URL:https://github.com/telemt/telemt/releases/download/{version}/telemt-{platform}.tar.gz}
      fallback-url-template: ${TELEMT_FALLBACK_URL:}
      latest-api: ${TELEMT_LATEST_API:https://api.github.com/repos/telemt/telemt/releases/latest}

xray:
  server:
    host: ${XRAY_HOST:127.0.0.1}
    public-port: ${XRAY_PUBLIC_PORT:443}
  # Т06: REALITY маскируется под свой сайт и своё имя, а не под чужой домен.
  # Дефолты применяются только к вновь сгенерированным конфигам; живой конфиг
  # на узле меняется отдельно (xray_config_update → activate → apply).
  reality:
    dest: ${XRAY_REALITY_DEST:127.0.0.1:8444}
    server-names: ${XRAY_REALITY_SNI:edge.pohr-roclh.xyz}

server:
  port: 8080
  forward-headers-strategy: framework