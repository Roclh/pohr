<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Roclh — coming soon</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b0b0e;
            --panel: #131318;
            --text: #f4f4f5;
            --muted: #9b9ba6;
            --accent: #d8ff4f;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(900px 500px at 15% -10%, #23232b 0%, transparent 60%),
                radial-gradient(700px 420px at 110% 110%, #1b2410 0%, transparent 55%),
                var(--bg);
            color: var(--text);
            font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        main {
            width: min(680px, 100%);
            padding: clamp(28px, 6vw, 56px);
            border: 1px solid #26262f;
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(255,255,255,.03), transparent), var(--panel);
            box-shadow: 0 30px 80px rgba(0,0,0,.45);
        }
        .mark {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            font-size: 12px;
            color: var(--accent);
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 16px var(--accent);
        }
        h1 {
            margin: 18px 0 10px;
            font-size: clamp(40px, 9vw, 76px);
            line-height: .95;
            letter-spacing: -.04em;
        }
        p { margin: 0; color: var(--muted); max-width: 46ch; }
        .status {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #26262f;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            font-size: 13px;
            color: #7f7f8a;
        }
        .tag {
            padding: 4px 10px;
            border: 1px solid #2e2e38;
            border-radius: 999px;
            color: #c9c9d2;
        }
    </style>
</head>
<body>
<main>
    <span class="mark"><span class="dot"></span> Roclh</span>
    <h1>Coming<br>soon.</h1>
    <p>Монтаж Reels и TikTok: портфолио, услуги и контакт — скоро здесь.</p>
    <div class="status">
        <span class="tag">site under construction</span>
        <span>pohr-roclh.xyz</span>
    </div>
</main>
</body>
</html>
