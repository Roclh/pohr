<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{admin.edge.sites})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<nav th:replace="~{fragments/layout :: crumbs('admin.edge.sites', 'admin.edge.title', '/admin/edge')}"></nav>

<main class="container narrow">
    <h1 th:text="${mode == 'create'} ? #{admin.edge.site.new} : #{admin.edge.site.edit}">Site</h1>

    <form th:action="${mode == 'create'} ? @{/admin/edge/sites} : @{/admin/edge/sites/{id}(id=${siteId})}"
          th:object="${form}" method="post" class="form card">

        <div class="field" th:classappend="${#fields.hasErrors('domain')} ? 'has-error'">
            <label for="domain" th:text="#{admin.edge.site.domain}">Domain</label>
            <input type="text" id="domain" th:field="*{domain}" placeholder="pohr-roclh.xyz" autofocus>
            <p class="field-error" th:if="${#fields.hasErrors('domain')}" th:errors="*{domain}">err</p>
        </div>

        <div class="field" th:classappend="${#fields.hasErrors('siteType')} ? 'has-error'">
            <label for="siteType" th:text="#{admin.edge.site.type}">Type</label>
            <select id="siteType" th:field="*{siteType}">
                <option value="proxy" th:text="#{admin.edge.site.type.proxy}">Reverse proxy</option>
                <option value="redirect" th:text="#{admin.edge.site.type.redirect}">Redirect</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('siteType')}" th:errors="*{siteType}">err</p>
        </div>

        <div class="field" th:classappend="${#fields.hasErrors('bindAddress')} ? 'has-error'">
            <label for="bindAddress" th:text="#{admin.edge.site.bindAddress}">Bind address</label>
            <input type="text" id="bindAddress" th:field="*{bindAddress}" placeholder="127.0.0.1">
            <p class="hint" th:text="#{admin.edge.site.bindAddress.hint}"></p>
            <p class="field-error" th:if="${#fields.hasErrors('bindAddress')}" th:errors="*{bindAddress}">err</p>
        </div>

        <!-- ===== proxy-only fields ===== -->
        <div class="field" th:classappend="${#fields.hasErrors('upstreamHost')} ? 'has-error'">
            <label for="upstreamHost" th:text="#{admin.edge.site.upstreamHost}">Upstream host</label>
            <input type="text" id="upstreamHost" th:field="*{upstreamHost}" placeholder="127.0.0.1">
            <p class="field-error" th:if="${#fields.hasErrors('upstreamHost')}" th:errors="*{upstreamHost}">err</p>
        </div>

        <div class="field" th:classappend="${#fields.hasErrors('upstreamPort')} ? 'has-error'">
            <label for="upstreamPort" th:text="#{admin.edge.site.upstreamPort}">Upstream port</label>
            <input type="number" id="upstreamPort" th:field="*{upstreamPort}" min="1" max="65535">
            <p class="field-error" th:if="${#fields.hasErrors('upstreamPort')}" th:errors="*{upstreamPort}">err</p>
        </div>

        <!-- ===== redirect-only fields ===== -->
        <div class="field" th:classappend="${#fields.hasErrors('redirectTarget')} ? 'has-error'">
            <label for="redirectTarget" th:text="#{admin.edge.site.redirectTarget}">Redirect target</label>
            <input type="text" id="redirectTarget" th:field="*{redirectTarget}"
                   placeholder="https://pohr-roclh.xyz{uri}">
            <p class="hint" th:text="#{admin.edge.site.redirectTarget.hint}"></p>
            <p class="field-error" th:if="${#fields.hasErrors('redirectTarget')}" th:errors="*{redirectTarget}">err</p>
        </div>

        <div class="field" th:classappend="${#fields.hasErrors('redirectCode')} ? 'has-error'">
            <label for="redirectCode" th:text="#{admin.edge.site.redirectCode}">Redirect code</label>
            <select id="redirectCode" th:field="*{redirectCode}">
                <option value="">permanent (по умолчанию)</option>
                <option value="permanent">permanent (301)</option>
                <option value="temporary">temporary (302)</option>
                <option value="html">html</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('redirectCode')}" th:errors="*{redirectCode}">err</p>
        </div>

        <div class="field" th:classappend="${#fields.hasErrors('tlsMode')} ? 'has-error'">
            <label for="tlsMode" th:text="#{admin.edge.site.tls}">TLS mode</label>
            <select id="tlsMode" th:field="*{tlsMode}">
                <option value="acme">ACME (Let's Encrypt)</option>
                <option value="internal">Internal (self-signed)</option>
                <option value="off">Off (plain HTTP)</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('tlsMode')}" th:errors="*{tlsMode}">err</p>
        </div>

        <div class="field" th:classappend="${#fields.hasErrors('acmeEmail')} ? 'has-error'">
            <label for="acmeEmail" th:text="#{admin.edge.site.acmeEmail}">ACME email</label>
            <input type="email" id="acmeEmail" th:field="*{acmeEmail}">
            <p class="hint">Global email is taken from the first enabled site.</p>
            <p class="field-error" th:if="${#fields.hasErrors('acmeEmail')}" th:errors="*{acmeEmail}">err</p>
        </div>

        <div class="field">
            <label for="extraDirectives" th:text="#{admin.edge.site.extra}">Extra directives</label>
            <textarea id="extraDirectives" th:field="*{extraDirectives}"
                      rows="6" spellcheck="false" class="config-editor"></textarea>
        </div>

        <div class="field checkbox">
            <label>
                <input type="checkbox" th:field="*{enabled}">
                <span th:text="#{user.form.enabled}">Enabled</span>
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" th:text="#{user.form.save}">Save</button>
            <a class="link" th:href="@{/admin/edge/sites}" th:text="#{user.form.cancel}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
