<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{node.enroll.title})}"></head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <h1 th:text="#{node.enroll.title}">Node enrollment</h1>

    <div th:if="${successMessage}" class="alert success" th:text="#{${successMessage}}"></div>

    <section class="card">
        <h2 th:text="#{node.enroll.heading}">Run this command on a fresh EU VPS</h2>
        <p class="hint" th:text="#{node.enroll.hint}"></p>

        <div class="copy-box" style="margin: 16px 0;">
            <input type="text" readonly th:value="${enrollCommand}" id="enroll-cmd">
            <button type="button" class="copy-btn" data-copy-target="enroll-cmd"
                    th:text="#{node.enroll.copy}">Copy</button>
        </div>

        <p>
            <strong th:text="#{node.enroll.expires}">Expires at</strong>:
            <code th:text="${#strings.substringBefore(expiresAt.toString(), '.')}">2026-01-01T12:00:00</code>
        </p>

        <p>
            <strong th:text="#{node.enroll.token}">Token</strong>:
            <code th:text="${token.token}">abc123</code>
        </p>

        <p class="muted" th:text="#{node.enroll.done}">Node will appear in the list once registered.</p>
    </section>

    <div class="toolbar">
        <a class="link" th:href="@{/admin/nodes}" th:text="#{common.back}">Back</a>
    </div>

    <script>
        document.querySelectorAll('[data-copy-target]').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.copyTarget);
                navigator.clipboard.writeText(input.value).then(() => {
                    const original = btn.textContent;
                    btn.textContent = '✓';
                    setTimeout(() => btn.textContent = original, 1200);
                });
            });
        });
    </script>
</main>

</body>
</html>
