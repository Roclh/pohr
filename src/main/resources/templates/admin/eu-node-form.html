<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{node.form.title})}"></head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>
<nav th:replace="~{fragments/layout :: crumbs('node.form.title', 'admin.nodes.title', '/admin/nodes')}"></nav>

<main class="container narrow">
    <h1 th:text="#{node.form.title}">New EU node</h1>

    <div th:if="${errorMessage}" class="alert error" th:text="#{${errorMessage}}"></div>

    <form th:action="@{/admin/nodes}" th:object="${form}" method="post" class="form card">
        <div class="field" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
            <label for="name" th:text="#{node.form.name}">Name</label>
            <input type="text" id="name" th:field="*{name}" autofocus
                   placeholder="eu-de-1">
            <p class="hint" th:text="#{node.form.name.hint}"></p>
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">error</p>
        </div>

        <div class="field" th:classappend="${#fields.hasErrors('ttlMinutes')} ? 'has-error'">
            <label for="ttlMinutes" th:text="#{node.form.ttl}">TTL</label>
            <input type="number" id="ttlMinutes" th:field="*{ttlMinutes}" min="5" max="1440">
            <p class="hint" th:text="#{node.form.ttl.hint}"></p>
            <p class="field-error" th:if="${#fields.hasErrors('ttlMinutes')}" th:errors="*{ttlMinutes}">error</p>
        </div>

        <div class="form-actions">
            <button type="submit" th:text="#{node.form.create}">Create</button>
            <a class="link" th:href="@{/admin/nodes}" th:text="#{node.form.cancel}">Cancel</a>
        </div>
    </form>
</main>

</body>
</html>
