<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{invite.form.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<nav th:replace="~{fragments/layout :: crumbs('invite.form.title', 'admin.invites.title', '/admin/invites')}"></nav>

<main class="container narrow">
    <h1 th:text="#{invite.form.title}">New invite</h1>

    <form th:action="@{/admin/invites}" th:object="${form}" method="post" class="form card">
        <div class="field" th:classappend="${#fields.hasErrors('role')} ? 'has-error'">
            <label for="role" th:text="#{invite.form.role}">Role</label>
            <select id="role" th:field="*{role}">
                <option value="USER" th:text="#{user.form.role.user}">USER</option>
                <option value="ADMIN" th:text="#{user.form.role.admin}">ADMIN</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">error</p>
        </div>

        <div class="field" th:classappend="${#fields.hasErrors('ttlMinutes')} ? 'has-error'">
            <label for="ttlMinutes" th:text="#{invite.form.ttl}">TTL (minutes)</label>
            <input type="number" id="ttlMinutes" th:field="*{ttlMinutes}" min="5" max="43200">
            <p class="hint" th:text="#{invite.form.ttl.hint}">Default 10080 (7 days).</p>
            <p class="field-error" th:if="${#fields.hasErrors('ttlMinutes')}" th:errors="*{ttlMinutes}">error</p>
        </div>

        <div class="form-actions">
            <button type="submit" th:text="#{invite.form.save}">Create</button>
            <a class="link" th:href="@{/admin/invites}" th:text="#{invite.form.cancel}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
