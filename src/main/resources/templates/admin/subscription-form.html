<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{subscription.form.title})}"></head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main class="container narrow">
    <h1 th:text="#{subscription.form.title}">New subscription</h1>

    <p th:if="${users.isEmpty()}" class="muted" th:text="#{subscription.form.no-users}">All users already have subscriptions</p>

    <form th:if="${!users.isEmpty()}"
          th:action="@{/admin/subscriptions}"
          th:object="${form}" method="post" class="form card">

        <div class="field" th:classappend="${#fields.hasErrors('userId')} ? 'has-error'">
            <label for="userId" th:text="#{subscription.form.user}">User</label>
            <select id="userId" th:field="*{userId}">
                <option value="" th:text="#{subscription.form.user.select}">— select user —</option>
                <option th:each="u : ${users}"
                        th:value="${u.id}"
                        th:text="${u.username}">user</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('userId')}"
               th:errors="*{userId}">error</p>
        </div>

        <div class="field checkbox">
            <label>
                <input type="checkbox" th:field="*{enabled}">
                <span th:text="#{subscription.form.enabled}">Active</span>
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" th:text="#{subscription.form.save}">Create</button>
            <a class="link" th:href="@{/admin/subscriptions}" th:text="#{subscription.form.cancel}">Cancel</a>
        </div>
    </form>

    <div class="form-actions" th:if="${users.isEmpty()}">
        <a class="link" th:href="@{/admin/subscriptions}" th:text="#{common.back}">Back</a>
    </div>
</main>

</body>
</html>
