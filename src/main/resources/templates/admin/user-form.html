<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{user.form.title})}"></head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>
<nav th:replace="~{fragments/layout :: crumbs('user.form.title', 'admin.users.title', '/admin/users')}"></nav>

<main class="container narrow">
    <h1 th:text="${mode == 'create'} ? #{user.form.title.create} : #{user.form.title.edit}">User</h1>

    <form th:action="${mode == 'create'} ? @{/admin/users} : @{/admin/users/{id}(id=${userId})}"
          th:object="${form}" method="post" class="form card">

        <div class="field" th:classappend="${#fields.hasErrors('username')} ? 'has-error'">
            <label for="username" th:text="#{user.form.username}">Username</label>
            <input type="text" id="username" th:field="*{username}" autofocus>
            <p class="field-error" th:if="${#fields.hasErrors('username')}"
               th:errors="*{username}">error</p>
        </div>

        <div class="field" th:classappend="${#fields.hasErrors('password')} ? 'has-error'">
            <label for="password" th:text="#{user.form.password}">Password</label>
            <input type="password" id="password" th:field="*{password}" autocomplete="new-password">
            <p class="hint" th:text="${mode == 'edit'} ? #{user.form.password.hint.edit} : #{user.form.password.hint.create}"></p>
            <p class="field-error" th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}">error</p>
        </div>

        <div class="field" th:classappend="${#fields.hasErrors('role')} ? 'has-error'">
            <label for="role" th:text="#{user.form.role}">Role</label>
            <select id="role" th:field="*{role}">
                <option value="USER" th:text="#{user.form.role.user}">USER</option>
                <option value="ADMIN" th:text="#{user.form.role.admin}">ADMIN</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('role')}"
               th:errors="*{role}">error</p>
        </div>

        <div class="field checkbox" th:classappend="${#fields.hasErrors('enabled')} ? 'has-error'">
            <label>
                <input type="checkbox" th:field="*{enabled}">
                <span th:text="#{user.form.enabled}">Enabled</span>
            </label>
            <p class="field-error" th:if="${#fields.hasErrors('enabled')}"
               th:errors="*{enabled}">error</p>
        </div>

        <div class="form-actions">
            <button type="submit" th:text="#{user.form.save}">Save</button>
            <a class="link" th:href="@{/admin/users}" th:text="#{user.form.cancel}">Cancel</a>
        </div>
    </form>
</main>

</body>
</html>
