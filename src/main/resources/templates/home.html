<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(#{app.title})}"></head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <h1 th:text="#{home.title(${username})}">Welcome</h1>

    <section class="card">
        <h2 th:text="#{home.subscription.title}">Your subscription</h2>

        <div th:if="${subscriptionUrl}">
            <p class="hint" th:text="#{home.subscription.hint}">Import this URL into your VPN client.</p>
            <div class="copy-box">
                <input type="text" readonly th:value="${subscriptionUrl}" id="sub-url">
                <button type="button" class="copy-btn" data-copy-target="sub-url"
                        th:text="#{home.subscription.copy}">Copy</button>
            </div>
            <p th:if="${!subscriptionEnabled}" class="field-error"
               th:text="#{home.subscription.disabled}">Subscription is currently disabled</p>
        </div>

        <p th:unless="${subscriptionUrl}" class="muted"
           th:text="#{home.subscription.empty}">No subscription available yet.</p>
    </section>

    <script>
        document.querySelectorAll('[data-copy-target]').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.copyTarget);
                navigator.clipboard.writeText(input.value).then(() => {
                    const original = btn.textContent;
                    btn.textContent = '✓';
                    setTimeout(() => btn.textContent = original, 1200);
                });
            });
        });
    </script>

    <section class="card" sec:authorize="hasRole('ADMIN')">
        <h2 th:text="#{home.admin.title}">Admin tools</h2>
        <p th:text="#{home.admin.text}">Text</p>
        <a class="button" th:href="@{/admin}" th:text="#{home.admin.button}">Open</a>
    </section>
</main>

</body>
</html>
