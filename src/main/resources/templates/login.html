<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="#{app.title} + ' — ' + #{login.subtitle}">Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">

<div class="login-card">
    <h1 th:text="#{app.title}">Pohr</h1>
    <h2 th:text="#{login.subtitle}">Sign in</h2>

    <div th:if="${param.error}" class="alert error" th:text="#{login.error}"></div>
    <div th:if="${param.logout}" class="alert info" th:text="#{login.logout}"></div>

    <form th:action="@{/login}" method="post">
        <label>
            <span th:text="#{login.username}">Username</span>
            <input type="text" name="username" autofocus required
                   autocomplete="username"
                   autocapitalize="off"
                   autocorrect="off"
                   spellcheck="false">
        </label>
        <label>
            <span th:text="#{login.password}">Password</span>
            <input type="password" name="password" required
                   autocomplete="current-password">
        </label>
        <button type="submit" th:text="#{login.submit}">Log in</button>
    </form>

    <div class="lang-switch-login">
        <a th:href="@{''(lang='en')}" th:text="#{lang.en}">EN</a>
        <span>·</span>
        <a th:href="@{''(lang='ru')}" th:text="#{lang.ru}">RU</a>
    </div>
</div>

</body>
</html>
